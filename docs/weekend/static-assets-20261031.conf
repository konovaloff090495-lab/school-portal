# Installed in the HTTPS pro-schools.ru server block on 2026-10-31.
# Next's public file inventory does not discover assets added after startup.
# Scoped route avoids an application restart for editorial data releases.
location ^~ /blog/weekend-20261031/ {
 root /srv/portfolio/proschools/current/public;
 try_files $uri =404;
 add_header X-Content-Type-Options nosniff always;
 add_header Cache-Control "public, max-age=86400" always;
}
