# Insert in the existing HTTPS server for pro-schools.ru.
# Necessary for public files added after the currently running Next build.
location ^~ /partners/skysmart/ {
 root /srv/portfolio/proschools/current/public;
 try_files $uri =404;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Cache-Control "public, max-age=300";
}
