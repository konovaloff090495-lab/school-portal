name: Encrypted lead vault checks
on:
  push:
    paths:
      - scripts/security/lead-vault/**
      - scripts/privacy/**
      - scripts/crm-mailer.py
      - scripts/school-submissions*.py
      - scripts/test-school-submissions.py
      - src/lib/lead-vault.ts
      - .github/workflows/lead-vault-checks.yml
  pull_request:
    paths:
      - scripts/security/lead-vault/**
      - scripts/privacy/**
      - scripts/crm-mailer.py
      - scripts/school-submissions*.py
      - scripts/test-school-submissions.py
      - src/lib/lead-vault.ts
      - .github/workflows/lead-vault-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/security/lead-vault/
            /src/lib/lead-vault.ts
            /scripts/privacy/
            /scripts/crm-mailer.py
            /scripts/school-submissions.py
            /scripts/school-submissions-telegram.py
            /scripts/test-school-submissions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/security/lead-vault/test-mfa.mjs
      - run: node scripts/security/lead-vault/test.mjs
      - run: node --experimental-strip-types scripts/security/lead-vault/test-client.mjs
      - run: node scripts/security/lead-vault/test-outbox.mjs
      - run: python3 -m py_compile scripts/security/lead-vault/ops/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-cryptography
      - run: /usr/bin/python3 scripts/privacy/test-fields.py
      - run: /usr/bin/python3 scripts/privacy/test-proschools-mailer.py
      - run: /usr/bin/python3 scripts/privacy/test-mailer-client.py
      - run: /usr/bin/python3 scripts/test-school-submissions.py
