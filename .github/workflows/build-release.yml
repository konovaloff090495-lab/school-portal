name: Build release artifact

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted build image
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: build-release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-lead-consent.mjs
      - run: node scripts/security/lead-vault/test.mjs
      - run: node --experimental-strip-types scripts/security/lead-vault/test-client.mjs
      - run: node --experimental-strip-types scripts/test-review-store.mjs
      - run: python3 scripts/test-school-submissions.py
      - run: npm run lint:leads
      - run: python3 scripts/check-navigation-policy.py
      - run: node scripts/family-schools/check-catalog.mjs
      - run: node scripts/seo-school-formats/check.mjs
      - run: node scripts/leads-growth/check.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-school-submissions-http.mjs
        timeout-minutes: 5
        env:
          RUN_BROWSER_TESTS: '1'
          SCHOOL_SUBMISSIONS_SMOKE_DEV: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: school-form-debug
          path: work/school-submission-qa/
          retention-days: 2
      - run: node scripts/schools/check-media.mjs
      - run: npm run build
      - run: node scripts/test-review-http.mjs
        timeout-minutes: 3
      - run: node scripts/seo-school-formats/check-http.mjs
        timeout-minutes: 3
      - run: node scripts/leads-growth/check-http.mjs
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: leads-growth-debug
          path: work/leads-growth-qa/
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: school-format-debug
          path: work/seo-school-formats-qa/
          retention-days: 2
      - name: Package build and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir build-release
          COPYFILE_DISABLE=1 tar --exclude='./cache' --exclude='./dev' -cf - -C .next . | zstd -T2 -8 --long=27 -o build-release/next-release.tar.zst
          (cd build-release && if command -v sha256sum >/dev/null 2>&1; then sha256sum next-release.tar.zst; else shasum -a 256 next-release.tar.zst; fi > SHA256SUMS)
          cp -r work/school-submission-qa build-release/qa
          cp -r work/seo-school-formats-qa build-release/qa-school-formats
          cp -r work/leads-growth-qa build-release/qa-leads-growth
          cp .next/BUILD_ID build-release/BUILD_ID
          git rev-parse HEAD > build-release/SOURCE_COMMIT
      - run: node scripts/test-school-submissions-http.mjs
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        with:
          name: next-release
          path: build-release/
          retention-days: 2
          compression-level: 0
