name: Independent portfolio monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-portfolio-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: scripts/security
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .portfolio-monitor
          key: portfolio-monitor-v1-${{ github.run_id }}
          restore-keys: portfolio-monitor-v1-
      - run: python3 scripts/security/test-external-monitor.py
      - run: python3 scripts/security/external-monitor.py
        env:
          PORTFOLIO_MONITOR_URL: ${{ secrets.PORTFOLIO_MONITOR_URL }}
          PORTFOLIO_MONITOR_USER: ${{ secrets.PORTFOLIO_MONITOR_USER }}
          PORTFOLIO_MONITOR_PASSWORD: ${{ secrets.PORTFOLIO_MONITOR_PASSWORD }}
          PORTFOLIO_ALERT_BOT_TOKEN: ${{ secrets.PORTFOLIO_ALERT_BOT_TOKEN }}
          PORTFOLIO_ALERT_CHAT_ID: ${{ secrets.PORTFOLIO_ALERT_CHAT_ID }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success()
        with:
          path: .portfolio-monitor
          key: portfolio-monitor-v1-${{ github.run_id }}
