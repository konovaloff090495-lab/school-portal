# Production is released only with ./deploy.sh from the maintainer's machine.
# The former push hook ran npm ci and pkill on the live VPS, racing local
# deployments and causing intermittent 502 responses for users and crawlers.
name: Deployment instructions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use ./deploy.sh locally. It stages, cold-checks and activates the release with rollback. No builds or dependency reinstalls on the live VPS.'
