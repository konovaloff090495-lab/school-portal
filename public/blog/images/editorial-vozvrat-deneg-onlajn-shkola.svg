<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Отказ от обучения: что проверить</title><desc id="desc">Порядок проверки договора, заявления, расчёта и возврата оплаты онлайн-школы</desc><rect width="1200" height="760" rx="28" fill="#F5F3EE"/><rect width="1200" height="178" rx="28" fill="#19313B"/><path d="M0 140h1200v38H0z" fill="#19313B"/><text x="56" y="62" fill="#B9D9D4" font-size="23" font-family="Arial,sans-serif" letter-spacing="3">PRO-SCHOOLS.RU · ПАМЯТКА</text><text x="56" y="126" fill="white" font-size="37" font-weight="700" font-family="Arial,sans-serif">Отказ от обучения: что проверить</text><rect x="56" y="216" width="534" height="213" rx="18" fill="white" stroke="#D6DFD9"/><circle cx="98" cy="259" r="22" fill="#F5744A"/><text x="98" y="267" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial,sans-serif">1</text><text x="134" y="267" fill="#19313B" font-size="27" font-weight="700" font-family="Arial,sans-serif">Договор</text><text x="84" y="324" fill="#496168" font-size="27" font-family="Arial,sans-serif">Услуги, оплата</text><text x="84" y="364" fill="#496168" font-size="27" font-family="Arial,sans-serif">и условия исполнения</text><rect x="610" y="216" width="534" height="213" rx="18" fill="white" stroke="#D6DFD9"/><circle cx="652" cy="259" r="22" fill="#F5744A"/><text x="652" y="267" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial,sans-serif">2</text><text x="688" y="267" fill="#19313B" font-size="27" font-weight="700" font-family="Arial,sans-serif">Заявление</text><text x="638" y="324" fill="#496168" font-size="27" font-family="Arial,sans-serif">Письменный отказ</text><text x="638" y="364" fill="#496168" font-size="27" font-family="Arial,sans-serif">и подтверждение доставки</text><rect x="56" y="451" width="534" height="213" rx="18" fill="white" stroke="#D6DFD9"/><circle cx="98" cy="494" r="22" fill="#F5744A"/><text x="98" y="502" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial,sans-serif">3</text><text x="134" y="502" fill="#19313B" font-size="27" font-weight="700" font-family="Arial,sans-serif">Расчёт</text><text x="84" y="559" fill="#496168" font-size="27" font-family="Arial,sans-serif">Оказанные услуги</text><text x="84" y="599" fill="#496168" font-size="27" font-family="Arial,sans-serif">и подтверждённые расходы</text><rect x="610" y="451" width="534" height="213" rx="18" fill="white" stroke="#D6DFD9"/><circle cx="652" cy="494" r="22" fill="#F5744A"/><text x="652" y="502" text-anchor="middle" fill="white" font-size="23" font-weight="700" font-family="Arial,sans-serif">4</text><text x="688" y="502" fill="#19313B" font-size="27" font-weight="700" font-family="Arial,sans-serif">Возврат</text><text x="638" y="559" fill="#496168" font-size="27" font-family="Arial,sans-serif">Сумма и реквизиты</text><text x="638" y="599" fill="#496168" font-size="27" font-family="Arial,sans-serif">обязательства по рассрочке</text><text x="56" y="728" fill="#647875" font-size="22" font-family="Arial,sans-serif">Условия проверяйте по договору и официальным документам.</text></svg>